services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: links
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5435:5432"
    volumes:
      - links_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d links"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  links_postgres:
